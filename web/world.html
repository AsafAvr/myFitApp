<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: the island is the hero; habits listed beside it like a ledger of places */
  --bg: #efe8d6; --paper: #f7f0dd; --card: #fbf6ea; --ink: #2c241b; --ink-2: #5b4d3c; --ink-3: #8c7c66;
  --line: #ddd0b4; --accent: #4d7a3a; --amber: #c8862a; --rust: #a4483a;
  --display: "Bricolage Grotesque", "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --body: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: Caveat, "Bradley Hand", "Segoe Print", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1a1612; --paper: #231e18; --card: #221d17; --ink: #efe6d2; --ink-2: #c2b49a; --ink-3: #8f816b; --line: #3a3127; --accent: #8fc06f; --amber: #e5a64b; --rust: #d8786a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1a1612; --paper: #231e18; --card: #221d17; --ink: #efe6d2; --ink-2: #c2b49a; --ink-3: #8f816b; --line: #3a3127; --accent: #8fc06f; --amber: #e5a64b; --rust: #d8786a; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 clamp(30px, 5vw, 46px)/1 var(--hand); margin: 0 0 6px; color: var(--ink); }
.lede { color: var(--ink-2); margin: 0 0 16px; max-width: 66ch; }
.grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; background: #efe4c8; touch-action: manipulation; box-shadow: 0 1px 2px rgba(60,40,10,.08), 0 10px 30px rgba(60,40,10,.12); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tip { position: absolute; pointer-events: none; background: rgba(30,24,16,.94); color: #f6efe0; border-radius: 10px; padding: 7px 10px; font-size: 12.5px; line-height: 1.4; max-width: 240px; transform: translate(-50%, calc(-100% - 12px)); opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.controls { display: flex; align-items: center; gap: 10px; padding: 12px 2px 4px; flex-wrap: wrap; }
.controls input[type=range] { flex: 1; min-width: 150px; accent-color: var(--accent); }
.date { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 14px; min-width: 100px; text-align: right; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:focus-visible, .habit:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.list { display: grid; gap: 8px; }
.habit { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; cursor: pointer; min-width: 0; }
.habit.sel { border-color: var(--amber); box-shadow: 0 0 0 2px color-mix(in srgb, var(--amber) 35%, transparent); }
.habit .nm { font: 650 16px var(--display); }
.habit .tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; font-family: var(--body); font-weight: 500; }
.habit .place { font: 600 17px/1.2 var(--hand); color: var(--ink-2); grid-column: 1 / -1; }
.habit .meta { color: var(--ink-3); font-size: 12.5px; grid-column: 1 / 2; font-variant-numeric: tabular-nums; }
.habit .spark { grid-row: 1 / 3; grid-column: 2; align-self: center; }
.habit .log { grid-column: 2; grid-row: 3 / 5; align-self: end; }
.habit .bar { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 4px; }
.habit .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.habit.faded .bar i { background: var(--ink-3); }
details.add { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
details.add summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.addrow input, .addrow select { font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); min-width: 0; }
.addrow input[type=text] { flex: 1 1 150px; }
.note { color: var(--ink-3); font-size: 12.5px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Your valley</h1>
  <p class="lede" id="lede"></p>
  <div class="grid">
    <section>
      <div class="stage" id="stage"><canvas id="cv"></canvas><div class="tip" id="tip"></div></div>
      <div class="controls">
        <button class="btn primary" id="play">▶ Watch it grow</button>
        <input type="range" id="time" min="0" max="100" step="1" aria-label="Date">
        <span class="date" id="date"></span>
        <button class="btn" id="today">Today</button>
      </div>
    </section>
    <aside>
      <div class="list" id="list"></div>
      <details class="add" id="add">
        <summary>Add a habit to the valley</summary>
        <form class="addrow" id="addForm">
          <input type="text" id="addName" placeholder="e.g. Journaling" maxlength="24" required aria-label="Habit name">
          <select id="addKind" aria-label="Its place in the valley"></select>
          <select id="addTarget" aria-label="Times per week">
            <option value="1">1× / week</option><option value="2">2× / week</option><option value="3" selected>3× / week</option>
            <option value="4">4× / week</option><option value="5">5× / week</option><option value="7">daily</option>
          </select>
          <button class="btn primary" type="submit">Add</button>
        </form>
      </details>
      <p class="note" id="note"></p>
    </aside>
  </div>
</div>
<script>window.__GENOME__ = /*__GENOME__*/null;</script>
<script>/*__TREEJS__*/</script>
<script>/*__WORLDJS__*/</script>
</body>
</html>
