<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="title">Running tree</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="seasonChip"></span>
    <button class="btn" id="dlBtn" title="Save this tree as an image">⤓ Image</button>
  </header>

  <div class="grid">
    <section>
      <div class="card">
        <div class="stage" id="stage">
          <canvas id="tree"></canvas>
          <canvas id="ambient"></canvas>
          <div class="badge" id="badge"></div>
          <div class="tip" id="tip"></div>
        </div>
        <div class="controls">
          <button class="btn primary" id="playBtn">▶ Watch it grow</button>
          <input type="range" id="time" min="0" max="100" step="0.25" aria-label="Date">
          <span class="date" id="dateLbl"></span>
          <button class="btn" id="todayBtn">Today</button>
        </div>
        <div class="kpis" id="kpis"></div>
        <div class="legend">
          <span>🍒 easy</span><span>🍎 long</span><span>🍊 fast</span><span>🫐 hilly</span><span>🌟 race</span><span>🌸 PR</span><span>🟠 amber ring = milestone</span><span>🪺 streak</span>
        </div>
      </div>
      <div class="card story" id="story"></div>
    </section>

    <aside class="panel" id="panel"></aside>
  </div>
  <footer>
    Grown from <span id="srcLbl">Strava</span> data · regenerated <span id="genLbl"></span> ·
    every element is seeded by the run it represents, so the tree only ever changes when you run.
  </footer>
</div>
<canvas id="cardOut"></canvas>
<script>window.__GENOME__ = /*__GENOME__*/null; window.__STORY__ = /*__STORY__*/null;</script>
<script>/*__TREEJS__*/</script>
<script>/*__VIEWERJS__*/</script>
</body>
</html>
